<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>阅读收获 · 书单</title>
<style>
  :root {
    --bg: #0b0c0f;
    --panel: #14161c;
    --panel-2: #171b24;
    --line: #2a2e38;
    --text: #f2efe8;
    --ink-2: #c9cdd6;
    --mute: #9aa1ad;
    --c: #e2a15c;
    --pad: clamp(14px, 3vw, 32px);
    --gutter: max(var(--pad), calc((100vw - 1200px) / 2));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    line-height: 1.65; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--c); }

  header {
    padding: calc(26px + env(safe-area-inset-top)) var(--gutter) 20px;
    border-bottom: 1px solid var(--line);
    background:
      radial-gradient(820px 280px at 0% -30%, color-mix(in srgb, var(--c) 32%, transparent), transparent 58%),
      radial-gradient(640px 240px at 100% -40%, rgba(183,154,224,.16), transparent 60%),
      linear-gradient(180deg, #12141a, var(--bg));
  }
  .eyebrow {
    display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline;
    color: var(--mute); font-size: 12px; letter-spacing: .08em;
  }
  .eyebrow b { color: #e7c27a; font-weight: 700; letter-spacing: .12em; }
  .eyebrow a { text-decoration: none; font-weight: 600; }
  .eyebrow a:hover { text-decoration: underline; }
  h1 { margin: 10px 0 6px; font-size: clamp(26px, 4.5vw, 36px); font-weight: 750; letter-spacing: -.01em; }
  .lead { margin: 0; max-width: 70ch; color: var(--mute); font-size: 14.5px; }
  .warn {
    display: inline-block; margin-top: 14px; padding: 6px 14px; border-radius: 999px;
    background: color-mix(in srgb, var(--c) 16%, transparent);
    color: color-mix(in srgb, var(--c) 42%, #fff); font-size: 12.5px;
  }
  .pv { margin-top: 8px; color: var(--mute); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .pv b { color: var(--c); font-weight: 700; }


  .search-wrap {
    padding: 16px var(--gutter) 4px;
    background: #0f1116;
  }
  .search-box {
    display: flex; align-items: center; gap: 10px;
    max-width: 520px; padding: 9px 14px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px;
    transition: border-color .15s;
  }
  .search-box:focus-within { border-color: var(--c); }
  .search-box svg { flex: none; width: 16px; height: 16px; color: var(--mute); }
  .search-box input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    color: var(--text); font: inherit; font-size: 14px;
  }
  .search-box input::placeholder { color: var(--mute); }
  .search-clear {
    flex: none; border: 0; background: transparent; color: var(--mute);
    cursor: pointer; font-size: 18px; line-height: 1; padding: 0 2px;
  }
  .search-clear:hover { color: var(--text); }
  .search-results {
    max-width: 520px; margin: 8px 0 0; padding: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    display: none;
  }
  .search-results.on { display: block; }
  .search-item {
    display: block; width: 100%; text-align: left; cursor: pointer;
    padding: 8px 10px; border: 0; border-radius: 8px; background: transparent;
    color: var(--text); font: inherit; font-size: 13.5px;
  }
  .search-item:hover, .search-item:focus { background: color-mix(in srgb, var(--c) 14%, transparent); outline: 0; }
  .search-item .s-en { display: block; color: var(--mute); font-size: 12px; font-style: italic; }
  .search-empty { padding: 10px; color: var(--mute); font-size: 13px; }

  #flow {
    padding: 18px var(--gutter) 20px;
    background: #0f1116;
    border-bottom: 1px solid var(--line);
  }
  .tabs-label {
    margin: 0 0 10px; color: #e7c27a; font-size: 11px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
  }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .sechead {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin: 26px 0 0; padding: 0 0 10px; border-bottom: 1px solid var(--line);
  }
  .sechead .sh-zh { font-size: 16px; font-weight: 750; color: var(--c); }
  .sechead .sh-en { color: var(--mute); font-size: 12.5px; font-style: italic; }
  .sechead .sh-n { margin-left: auto; color: var(--mute); font-size: 12px; font-variant-numeric: tabular-nums; }
  .secnote { margin: 8px 0 0; color: var(--mute); font-size: 13px; }
  .tab {
    appearance: none; font: inherit; text-align: left; cursor: pointer;
    border: 1px solid #2c3340; background: var(--panel-2); color: var(--text);
    border-radius: 14px; padding: 9px 16px 8px;
    transition: background .15s, border-color .15s;
  }
  .tab { border-top: 2px solid var(--tc, var(--line)); }
  .tab:hover { border-color: var(--tc, var(--line)); background: color-mix(in srgb, var(--tc, var(--panel)) 14%, var(--panel-2)); }
  .tab .zh { display: block; font-size: 17px; font-weight: 700; line-height: 1.35; }
  .tab .en { display: block; margin-top: 1px; color: var(--mute); font-size: 12px; }
  .tab .n {
    display: inline-block; margin-left: 8px; padding: 0 7px; border-radius: 999px;
    background: color-mix(in srgb, var(--tc, var(--c)) 20%, transparent); color: var(--tc, var(--c));
    font-size: 12px; font-weight: 650; vertical-align: 2px; font-variant-numeric: tabular-nums;
  }
  .tab.on {
    background: color-mix(in srgb, var(--tc) 16%, var(--panel-2));
    border-color: var(--tc); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tc) 55%, transparent);
  }
  .tab.on .zh { color: var(--tc); }
  .tab.on .n { background: var(--tc); color: #0b0c0f; }

  .flow {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 10px; margin-top: 16px;
  }
  .node {
    appearance: none; font: inherit; text-align: left; cursor: pointer; color: var(--text);
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .node:hover { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); box-shadow: 0 3px 12px rgba(0,0,0,.35); }
  .node.on {
    background: color-mix(in srgb, var(--c) 14%, var(--panel));
    border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c);
  }
  .node.future { border-style: dashed; background: transparent; opacity: .7; cursor: default; box-shadow: none; }
  .node .k {
    flex: none; min-width: 20px; padding-top: 1px;
    color: var(--c); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .node .names { min-width: 0; }
  .node .t { display: block; font-size: 14px; font-weight: 650; line-height: 1.4; }
  .node .te { display: block; margin-top: 2px; color: var(--mute); font-size: 12px; line-height: 1.35; }
  .arrow { align-self: center; color: var(--mute); font-size: 18px; }

  main { display: grid; grid-template-columns: 1fr; padding: 30px var(--gutter) 0; }
  @media (min-width: 980px) {
    main { grid-template-columns: minmax(0, 1fr) 220px; column-gap: 40px; }
  }
  .detail { min-width: 0; }
  .detail h2 { margin: 0; font-size: clamp(24px, 3.5vw, 30px); font-weight: 750; letter-spacing: -.01em; line-height: 1.3; }
  .title-en { margin-top: 4px; color: var(--mute); font-size: 15px; font-style: italic; }
  .meta { color: var(--mute); font-size: 13px; margin-top: 8px; }
  .oneline {
    margin: 20px 0 0; padding: 14px 18px; font-size: 16.5px; line-height: 1.7;
    background: var(--panel); border-left: 3px solid var(--c); border-radius: 0 12px 12px 0;
  }
  .oneline.en {
    margin-top: 0; padding-top: 0; color: var(--mute); font-size: 14px; font-style: italic;
    border-radius: 0 0 12px 0;
  }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 14px 0 0; font-size: 13px; }
  .facts dt { color: var(--mute); }
  .facts dd { margin: 0; color: var(--ink-2); }
  .sec-title {
    display: flex; align-items: center; gap: 12px;
    margin: 32px 0 14px; font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--c);
  }
  .sec-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .pair { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 720px) {
    .pair { grid-template-columns: 1fr 1fr; }
    .pair.single { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  .card h3 { margin: 0 0 8px; font-size: 16px; font-weight: 700; line-height: 1.45; }
  .card p { margin: 0; font-size: 14.5px; color: var(--ink-2); }
  .pair:not(.single) .card:nth-child(even) {
    background: color-mix(in srgb, var(--c) 9%, var(--panel));
    border-color: color-mix(in srgb, var(--c) 28%, var(--line));
  }
  .pair:not(.single) .card:nth-child(even) h3 { color: color-mix(in srgb, var(--c) 50%, #fff); }
  .pair:not(.single) .card:nth-child(even) p { color: #aab4c5; font-size: 14px; }
  .wish {
    margin: 20px 0 0; padding: 16px 20px; font-size: 17px;
    background: var(--panel); border-left: 3px solid #e08aa0; border-radius: 0 12px 12px 0;
  }
  .prose { max-width: 68ch; margin-top: 8px; }
  .prose p { margin: 0 0 16px; font-size: 16px; line-height: 1.9; color: var(--ink-2); }

  .side { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--line); }
  @media (min-width: 980px) {
    .side { margin-top: 0; padding-top: 4px; border-top: 0; position: sticky; top: 16px; align-self: start; }
  }
  .side h3 { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--mute); }
  .ref {
    display: block; padding: 8px 0; border-bottom: 1px solid var(--line);
    color: color-mix(in srgb, var(--c) 48%, #fff); text-decoration: none; font-size: 13px; line-height: 1.45;
  }
  .ref:hover .title { color: var(--c); text-decoration: underline; text-underline-offset: 3px; }
  .ref .kind { display: block; color: var(--mute); font-size: 11px; }
  .ref .title { font-weight: 600; }
  .ref .note { display: none; }
  .toc-box {
    margin: 0 0 16px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); overflow: hidden;
  }
  .toc-box summary {
    list-style: none; cursor: pointer; padding: 9px 11px;
    font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--c);
  }
  .toc-box summary::-webkit-details-marker { display: none; }
  .toc-box summary::after { content: "＋"; float: right; color: var(--mute); }
  .toc-box[open] summary::after { content: "－"; }
  .toc-list { padding: 0 11px 10px; }
  .toc-list.collapsed { max-height: 300px; overflow: hidden; }
  .toc-toggle {
    display: block; width: 100%; border: 0; border-top: 1px solid var(--line);
    background: transparent; color: var(--c); cursor: pointer;
    padding: 8px 11px; font-size: 12px; font-family: inherit;
  }
  .toc-row {
    display: block; padding: 5px 0; border-bottom: 1px solid var(--line);
    font-size: 12px; line-height: 1.4; color: var(--ink-2);
  }
  .toc-row:last-child { border-bottom: 0; }
  .toc-row .zh { display: block; }
  .toc-row .en { display: block; color: var(--mute); font-size: 10.5px; font-style: italic; }
  @media (max-width: 979px) {
    .toc-row { font-size: 13px; padding: 6px 0; }
    .toc-list.collapsed { max-height: none; overflow: visible; }
    .toc-toggle { display: none; }
  }
  footer {
    grid-column: 1 / -1; margin-top: 40px;
    padding: 14px 0 calc(18px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); color: var(--mute); font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow"><b>个人学习 · 阅读</b><a href="index.html">回到索引</a></div>
  <h1>阅读收获</h1>
  <div class="warn">目前 60 篇。后面默认中英对照。有英文原文的按原文；没有的由我翻译。</div>
  <div class="pv">本页已被阅读 <b id="busuanzi_value_page_pv">—</b> 次</div>
</header>
<div class="search-wrap">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="search-input" type="search" placeholder="搜索书名（中文 / English）" autocomplete="off" aria-label="搜索书名">
    <button class="search-clear" id="search-clear" type="button" aria-label="清除">&times;</button>
  </div>
  <div class="search-results" id="search-results"></div>
</div>
<div id="flow"></div>
<main>
  <section class="detail" id="detail"></section>
  <aside class="side">
    <h3>来源与原文</h3>
    <div id="refs"></div>
  </aside>
  <footer>阅读页的正文由我整理，原书以出版版为准。新书按同样结构加进 DATA.books，左边的节点会自动多一格。</footer>
</main>
<script>
const DATA = {
  books: [
    {
      id: "kill-dislike",
      title: "被讨厌的勇气",
      titleEn: "The Courage to Be Disliked",
      author: "岸见一郎、古贺史健（日文原著）· 阿德勒心理学入门",
      type: "心理学 / 自我成长",
      oneLine: "人的烦恼本质上是人际关系的烦恼。自由的代价是被别人讨厌，关键是把别人的课题和自己的课题分开。",
      oneLineEn: "Every worry is an interpersonal worry. Freedom has a price, which is being disliked, and the key is to separate other people's tasks from your own.",
            toc: [
        "一，关于人生意义和改变",
        "二，一切烦恼，本质上都是人际关系的烦恼，关于自卑感。",
        "三，人生的三大课题：交友课题、工作课题以及爱的课题。",
        "四，认可欲求",
        "五，课题分离",
        "六，幸福之源也在于人际关系。",
        "七，横向关系和纵向关系",
        "八，他者贡献",
        "九，过去，现在和未来",
      ],
sources: [
        {
          kind: "公众号 · 中文",
          title: "挣脱他人期待的枷锁：《被讨厌的勇气》教我的自由法则",
          href: "https://mp.weixin.qq.com/s/WDVtQ0q44eLIupAZoQnipQ",
        },
        {
          kind: "公众号 · 英文",
          title: "Breaking Free from the Shackles of Others' Expectations",
          href: "https://mp.weixin.qq.com/s/IC7A7GDuf_WAx_Hke9r-hA",
        }
      ],
      points: [
        {
          t: "一、经历的意义由自己赋予",
          w: "经历本身不是成功或失败的原因，决定我们生活的是我们给经历赋予的意义。人无论何时何地都可以改变；不改变，是因为自己下了不改变的决心。用错的时候，是拿意义由自己赋予，去否认那件事确实发生过。",
          tEn: "1. The Meaning of Experience Is Ours to Give",
          wEn: "Experience itself doesn't determine success or failure. What shapes us is the meaning we attach to our experiences. People can change at any time, in any circumstance. The reason you feel stuck is that you have decided not to change. Push that idea too far, though, and assigning meaning becomes a way of pretending the experience never happened."
        },
        {
          t: "二、自卑感本身不是坏事",
          w: "人都有自卑感，它推动人追求优越性，是健康成长的刺激。把自卑感当借口（自卑情结）才是问题。健全的比较是和理想的自己比，而不是和别人比。骄傲自大往往是强烈自卑感的伪装。用错的时候，是把和别人比出来的难受，当成应该被消灭的自卑。和理想的自己比，那种自卑是往前走的。",
          tEn: "2. Inferiority Feelings Are Not Bad in Themselves",
          wEn: "Everyone has feelings of inferiority. They push us to strive for superiority, and they can be a healthy spur to growth. The problem is using them as an excuse, which is what an inferiority complex is. Healthy comparison is with your ideal self, not with others. Arrogance often hides a deep sense of inferiority. Push the comparison too far, though, and you treat the sting as a flaw to be erased. Measured against the person you want to become, that sense of inferiority is what moves you forward."
        },
        {
          t: "三、人生三大课题：工作、交友、爱",
          w: "工作关系有共同成果这个简单目标，门槛最低；交友的关系需要主动迈出第一步，朋友的数量没有价值，关系的距离和深度才重要；爱的课题分为恋爱和亲子两阶段，亲子关系最难分离。用错的时候，是把工作上能合作，当成交友和爱也可以靠共同成果自动完成。越亲密的课题越要自己迈出去。",
          tEn: "3. The Three Life Tasks: Work, Friendship, Love",
          wEn: "Work relationships are the easiest to build, because you share a clear goal: results. Friendship requires you to make the first move, and the number of friends doesn't matter; only distance and depth do. The love task has two stages, and the bond between parent and child is the hardest to untangle. The trap is assuming that because you cooperate well at work, friendship and love will also take care of themselves through shared results. The closer the task, the more you have to step forward yourself."
        },
        {
          t: "四、认可欲求是烦恼的根源",
          w: "过度需要别人认可，就会按别人的期待活着，舍弃真正的自我。人并不是为了满足别人的期待而活。用错的时候，是把不被认可欲求绑住，听成不需要任何人的好评。",
          tEn: "4. The Desire for Recognition Is the Root of Worry",
          wEn: "Craving other people's approval makes you live by their expectations and abandon who you really are. You don't live to meet other people's expectations. Watch out for the opposite misreading, too: not needing approval doesn't mean you stop caring what anyone thinks at all."
        },
        {
          t: "五、课题分离",
          w: "分清一件事是谁的课题，看结果最终由谁承担。孩子学不学习是孩子的课题。父母的课题是爱和提供环境，不能替他学，也不能逼他学。别人怎么评价你的选择，是别人的课题。用错的时候，是把课题分离听成冷漠。分开的是结果由谁承担，不是出不出手。马可以牵到水边，水得它自己喝。",
          tEn: "5. Separation of Tasks",
          wEn: "Whose task something is depends on who ends up bearing its results. Whether a child studies is the child's task. The parents' task is to offer love and create the right setting. They can't study for the child or force the child to study. How other people judge your choices is their task. Separating tasks isn't coldness, though. What you separate is who bears the consequences, not whether you are willing to help. You can lead a horse to water, but the horse has to drink."
        },
        {
          t: "六、课题分离是入口，不是终点",
          w: "保持适度距离，伸手可及但不踏入对方领域。人际关系中的回报思想与课题分离相悖，既不寻求回报，也不被其束缚。自由的代价是被别人讨厌。用错的时候，是把被讨厌当成目标去追求。被讨厌是自由可能付出的代价，不是要去交换的东西。",
          tEn: "6. Separation Is the Entrance, Not the Goal",
          wEn: "Keep a healthy distance: close enough to reach each other, far enough not to intrude on the other person's space. A “return mindset” conflicts with the separation of tasks. You should neither expect repayment nor feel bound by it. Freedom comes with a price: other people may dislike you. But being disliked should never become the goal. It is a cost freedom may carry, not something you should go out and seek."
        },
        {
          t: "七、横向关系，而非纵向关系",
          w: "阿德勒心理学反对一切纵向关系，主张所有人际关系都是横向的、虽不同但平等的。最重要的是不评价他人，评价性的语言来自纵向关系。这种基于横向关系的援助叫做鼓励。用错的时候，是把横向关系听成大家一样，没有差别。横向是不靠评价把人分成上下。鼓励也不是夸奖。",
          tEn: "7. Horizontal, Not Vertical, Relationships",
          wEn: "Adlerian psychology rejects vertical relationships and treats every relationship as horizontal: different, but equal. The key isn't to evaluate others, because evaluation comes from vertical relationships. Help offered within horizontal relationships is called encouragement. Be careful, though: a horizontal relationship doesn't mean everyone is the same, with no differences. It means not using judgment to rank people as above or below one another. Encouragement isn't praise, either."
        },

const COLORS = ["#e2a15c", "#6fbf8a", "#e08aa0", "#b79ae0", "#e08a62", "#d4b36a", "#5ec4c0"];

const GROUPS = [
  { label: "心理与自我成长", en: "Mind & Growth", books: ["complaint-free-world", "kill-dislike", "courage-happy", "how-to-win-friends", "headspace", "let-them", "mindset", "danshari", "naval-happiness", "naval-redemption"] },
  { label: "习惯与效能", en: "Habits & Efficiency", books: ["seven-habits", "power-of-habit", "atomic-habits", "art-of-laziness", "how-to-find-want", "deliberate-practice", "life-by-me", "franklin-virtues"] },
  { label: "学习与养育", en: "Learning & Parenting", books: ["feynman-technique", "minimal-learning", "exam-decoded", "sponge-reading", "self-driven-child"] },
  { label: "思维与判断", en: "Thinking & Judgment", books: ["principles", "thinking-fast-1", "thinking-fast-2", "contagious", "lady-tasting-tea", "naked-statistics", "thinking-in-systems", "linked", "complexity-mitchell", "naval-judgment"] },
  { label: "财富、商业与经济", en: "Money, Business & Economics", books: ["naval-wealth", "winning", "positioning", "zero-to-one", "psychology-of-money", "random-walk", "mankiw-micro-1", "mankiw-micro-2", "mankiw-macro-1", "mankiw-macro-2"] },
  { label: "历史与地理", en: "History & Geography", books: ["guns-germs-steel", "why-is-china", "geography-sees-history", "age-of-discovery-1", "age-of-discovery-2"] },
  { label: "科学与生命", en: "Science & Life", books: ["origin-of-species", "selfish-gene", "genome-ridley", "body-bryson-1", "body-bryson-2", "body-bryson-3", "beauty-servitude"] },
  { label: "文学与人生感悟", en: "Literature & Life", books: ["charlottes-web", "alchemist", "father-forgets", "five-regrets", "stay-hungry"] },
];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function asEn(e) { e.lang = "en"; return e; }
function bookOf(id) { return DATA.books.find(b => b.id === id) || DATA.books[0]; }
function enOf(b, p, i) {
  if (p.tEn) return { t: p.tEn, w: p.wEn };
  if (b.en && b.en.points && b.en.points[i]) return b.en.points[i];
  return null;
}
function hashBook() {
  const h = decodeURIComponent(location.hash.slice(1));
  return DATA.books.some(b => b.id === h) ? h : DATA.books[0].id;
}
let current = hashBook();
let cat = 0;
function groupOf(id) {
  const i = GROUPS.findIndex(g => g.books.includes(id));
  return i < 0 ? 0 : i;
}

function renderFlow() {
  const host = document.getElementById("flow");
  host.innerHTML = "";
  const byId = {};
  DATA.books.forEach((b, i) => { byId[b.id] = { b, n: i + 1 }; });
  document.documentElement.style.setProperty("--c", COLORS[cat]);
  host.appendChild(el("div", "tabs-label", "一、分类 · Category"));
  const tabs = el("div", "tabs");
  GROUPS.forEach((g, gi) => {
    const tab = el("button", "tab" + (gi === cat ? " on" : ""));
    tab.type = "button";
    tab.style.setProperty("--tc", COLORS[gi]);
    const zh = el("span", "zh", g.label);
    zh.appendChild(el("span", "n", String(g.books.length)));
    tab.appendChild(zh);
    tab.appendChild(asEn(el("span", "en", g.en)));
    tab.onclick = () => {
      if (g.books.includes(current)) { cat = gi; renderFlow(); return; }
      const first = [...g.books].sort((a, b) => byId[a].n - byId[b].n)[0];
      if (decodeURIComponent(location.hash.slice(1)) === first) { current = first; render(); }
      else location.hash = first;
    };
    tabs.appendChild(tab);
  });
  host.appendChild(tabs);
  const g = GROUPS[cat];
  const head = el("div", "sechead");
  head.appendChild(el("span", "sh-zh", "二、「" + g.label + "」的详细书目指引"));
  head.appendChild(asEn(el("span", "sh-en", "The books in " + g.en)));
  head.appendChild(el("span", "sh-n", g.books.length + " 本"));
  host.appendChild(head);
  host.appendChild(el("p", "secnote", "下面只列这一类。点开一本，页面里的正文才会换成这一本。"));
  const row = el("div", "flow");
  [...g.books].sort((a, b) => byId[a].n - byId[b].n).forEach(id => {
    const { b, n } = byId[id];
    const btn = el("button", "node" + (b.id === current ? " on" : ""));
    btn.type = "button";
    btn.appendChild(el("span", "k", String(n).padStart(2, "0")));
    const names = el("span", "names");
    names.appendChild(el("span", "t", b.title));
    names.appendChild(asEn(el("span", "te", b.titleEn)));
    btn.appendChild(names);
    btn.onclick = () => { location.hash = b.id; };
    row.appendChild(btn);
  });
  host.appendChild(row);
}

function renderDetail() {
  const b = bookOf(current);
  const host = document.getElementById("detail");
  host.innerHTML = "";
  host.appendChild(el("h2", null, b.title));
  host.appendChild(asEn(el("div", "title-en", b.titleEn)));
  host.appendChild(el("div", "meta", b.author + " · " + b.type));
  if (b.kind === "prose") host.appendChild(el("p", "wish", b.oneLine));
  else host.appendChild(el("p", "oneline", b.oneLine));
  const oneEn = b.oneLineEn || (b.en && b.en.oneLine);
  if (oneEn) host.appendChild(asEn(el("p", "oneline en", oneEn)));

  const facts = el("dl", "facts");
  [["来源", b.sources.map(s => s.kind).join(" · ")]].forEach(([k, v]) => {
    facts.appendChild(el("dt", null, k));
    facts.appendChild(el("dd", null, v));
  });
  host.appendChild(facts);

  if (b.kind === "prose") {
    host.appendChild(el("div", "sec-title", "夜里"));
    const box = el("div", "prose");
    b.paragraphs.forEach(t => box.appendChild(el("p", null, t)));
    host.appendChild(box);
    return;
  }

  const bilingual = b.points.some((p, i) => enOf(b, p, i));
  host.appendChild(el("div", "sec-title", bilingual ? "核心观点 · 中英对照" : "核心观点"));
  const pair = el("div", bilingual ? "pair" : "pair single");
  b.points.forEach((p, i) => {
    const zh = el("div", "card");
    zh.appendChild(el("h3", null, p.t));
    zh.appendChild(el("p", null, p.w));
    pair.appendChild(zh);
    const q = enOf(b, p, i);
    if (q) {
      const en = asEn(el("div", "card"));
      en.appendChild(el("h3", null, q.t));
      en.appendChild(el("p", null, q.w));
      pair.appendChild(en);
    }
  });
  host.appendChild(pair);
}

function renderRefs() {
  const host = document.getElementById("refs");
  host.innerHTML = "";
  const b = bookOf(current);
  b.sources.forEach(s => {
    const a = el("a", "ref");
    a.href = s.href;
    a.target = "_blank";
    a.rel = "noopener";
    a.appendChild(el("span", "kind", s.kind));
    a.appendChild(el("span", "title", s.title));
    host.appendChild(a);
  });
  if (b.toc && b.toc.length) {
    const box = el("details", "toc-box");
    const sum = el("summary", null, "章节目录 · 对照原文查找");
    box.appendChild(sum);
    const list = el("div", "toc-list collapsed");
    b.toc.forEach(line => {
      const row = el("div", "toc-row");
      // 拆出中文关键词与英文原名：以最后一个英文段为界
      const zh = line.replace(/^[A-Za-z][^\u4e00-\u9fff]*?(?=[\u4e00-\u9fff])/, "").trim();
      const en = line.slice(0, line.length - zh.length).trim();
      row.appendChild(el("span", "zh", zh));
      if (en) row.appendChild(el("span", "en", en));
      list.appendChild(row);
    });
    box.appendChild(list);
    const toggle = el("button", "toc-toggle", `展开全部 ${b.toc.length} 章 ↓`);
    toggle.type = "button";
    toggle.addEventListener("click", () => {
      const collapsed = list.classList.toggle("collapsed");
      toggle.textContent = collapsed ? `展开全部 ${b.toc.length} 章 ↓` : "收起目录 ↑";
    });
    box.appendChild(toggle);
    host.appendChild(box);
  }
}

function render() {
  cat = groupOf(current);
  renderFlow();
  renderDetail();
  renderRefs();
  document.title = bookOf(current).title + " · 阅读收获";
}


function initSearch() {
  const input = document.getElementById("search-input");
  const results = document.getElementById("search-results");
  const clear = document.getElementById("search-clear");
  let items = [];

  function show(q) {
    q = q.trim().toLowerCase();
    if (!q) { results.className = "search-results"; results.innerHTML = ""; items = []; return; }
    const hits = DATA.books.filter(b =>
      b.title.toLowerCase().includes(q) ||
      (b.titleEn || "").toLowerCase().includes(q)
    ).slice(0, 12);
    results.innerHTML = "";
    if (!hits.length) {
      const d = el("div", "search-empty", "没有找到匹配的书名");
      results.appendChild(d);
    } else {
      hits.forEach(b => {
        const btn = el("button", "search-item");
        btn.type = "button";
        btn.appendChild(el("span", null, b.title));
        btn.appendChild(el("span", "s-en", b.titleEn || ""));
        btn.onclick = () => {
          location.hash = b.id;
          input.value = "";
          results.className = "search-results";
          results.innerHTML = "";
          input.blur();
        };
        results.appendChild(btn);
      });
    }
    results.className = "search-results on";
  }

  input.addEventListener("input", () => show(input.value));
  input.addEventListener("focus", () => { if (input.value.trim()) show(input.value); });
  clear.onclick = () => { input.value = ""; results.className = "search-results"; results.innerHTML = ""; input.focus(); };
  document.addEventListener("click", e => {
    if (!e.target.closest(".search-wrap")) { results.className = "search-results"; }
  });
}

initSearch();

window.addEventListener("hashchange", () => { current = hashBook(); render(); });
render();
</script>

          id: "code", en: "Code", label: "编程与 AI", short: "已有笔记",
          note: "Learn.docx 里已有的编程、机器学习和数值精度。Cloud 这个标题下面没有正文。",
          topics: ["编程语言", "Machine Learning", "FP32 / FP16 / INT8", "DirectML", "PyTorch", "TensorFlow", "训练", "推理", "INT8 稀疏与量化", "吴恩达", "Cloud"],
          empty: ["Cloud"]
        },
        {
          id: "learn-next", en: "Later", label: "后续补充", short: "这一线还没有的",
          future: true,
          note: "新工具、一门课或一套练习，先加在这里再拆成独立节点。",
          topics: []
        }
      ]
    },
    {
      id: "shared",
      title: "三条线外面",
      lead: "缩写、物理和公司笔记。先不塞进上面三条线。以后某条明确属于一条线，再挪过去。",
      shared: true,
      domains: [
        {
          id: "acr", en: "Glossary", label: "缩写", short: "A 到 X",
          note: "Learn.docx 开头的缩写表，按字母分节。",
          topics: ["Acronyms A–X"]
        },
        {
          id: "phys", en: "Physics", label: "电气物理", short: "电学底稿",
          note: "电流、功率、电容和麦克斯韦。给几条线共用，不复制进某一边。",
          topics: ["物理名词", "电", "电流", "电功率", "电容", "麦克斯韦方程组"]
        },
        {
          id: "co", en: "Company", label: "公司与财务", short: "组织以外的公司笔记",
          note: "财报季度笔记、净利润和毛利润、AET 与展会，以及 Intel / AMD 的公司简介。Jack 的 All Hands 也在这里。带团队的方法在 GPU CPM。",
          topics: ["Financial Results", "财务", "AET", "Intel", "AMD", "Jack CG All Hands"]
        },
        {
          id: "data", en: "Data", label: "Data Fabric", short: "数据架构",
          note: "两处 Data Fabric 都是数据管理架构。AMD 的片上互连在 CPM · 产品底稿，标题是 Infinity Fabric。",
          topics: ["Data Fabric"]
        }
      ]
    }
  ]
};

let current = { track: "cpm", domain: "duty" };
DATA.tracks.forEach(t => t.domains.forEach(d => { if (d.groups) d.topics = d.groups.flatMap(g => g.topics); }));
const qEl = document.getElementById("q");

function domainBy(trackId, domainId) {
  const track = DATA.tracks.find(t => t.id === trackId);
  return { track, domain: track.domains.find(d => d.id === domainId) };
}

function allTopics() {
  const rows = [];
  DATA.tracks.forEach(track => {
    track.domains.forEach(domain => {
      domain.topics.forEach(topic => {
        rows.push({ track, domain, topic, empty: (domain.empty || []).includes(topic) });
      });
    });
  });
  return rows;
}

function renderMaps() {
  const host = document.getElementById("maps");
  host.replaceChildren();
  DATA.tracks.forEach(track => {
    const sec = document.createElement("section");
    sec.className = "track" + (track.learn ? " learn" : "") + (track.shared ? " shared" : "");
    const head = document.createElement("div");
    head.className = "track-head";
    const h = document.createElement("h2");
    h.textContent = track.title;
    const p = document.createElement("p");
    p.textContent = track.lead;
    head.append(h, p);
    const wrap = document.createElement("div");
    wrap.className = "flow-wrap";
    const flow = document.createElement("div");
    flow.className = "flow";
    track.domains.forEach((domain, i) => {
      if (i) {
        const arrow = document.createElement("div");
        arrow.className = "arrow";
        arrow.textContent = "→";
        flow.appendChild(arrow);
      }
      const b = document.createElement("button");
      b.type = "button";
      b.className = "node" + (domain.future ? " future" : "") + (current.track === track.id && current.domain === domain.id ? " on" : "");
      b.innerHTML = '<span class="k"></span><span class="t"></span><span class="s"></span>';
      b.querySelector(".k").textContent = domain.en;
      b.querySelector(".t").textContent = domain.label;
      const n = domain.topics.length;
      b.querySelector(".s").textContent = domain.future && !n ? "空位" : (n + " 条");
      b.onclick = () => { current = { track: track.id, domain: domain.id }; qEl.value = ""; render(); };
      flow.appendChild(b);
    });
    wrap.appendChild(flow);
    sec.append(head, wrap);
    host.appendChild(sec);
  });
}

function chip(text, empty, query) {
  const el = document.createElement("span");
  el.className = "chip" + (empty ? " empty" : "");
  if (query && text.toLowerCase().includes(query)) {
    const i = text.toLowerCase().indexOf(query);
    el.append(text.slice(0, i));
    const m = document.createElement("mark");
    m.textContent = text.slice(i, i + query.length);
    el.append(m, text.slice(i + query.length));
    if (empty) el.append(" · 标题下无正文");
  } else {
    el.textContent = empty ? text + " · 标题下无正文" : text;
  }
  return el;
}

function renderDetail(query) {
  const host = document.getElementById("detail");
  host.replaceChildren();
  const { track, domain } = domainBy(current.track, current.domain);
  const head = document.createElement("div");
  head.className = "stage-head";
  const h = document.createElement("h2");
  h.textContent = track.title + " · " + domain.label;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = domain.en + " · " + domain.short + (domain.topics.length ? " · " + domain.topics.length + " 条标题" : " · 还没有标题");
  head.append(h, meta);
  host.appendChild(head);
  const note = document.createElement("p");
  note.className = "note";
  note.textContent = domain.note;
  host.appendChild(note);
  if (domain.page) {
    const a = document.createElement("a");
    a.className = "page";
    a.href = domain.page.href;
    a.innerHTML = '<span class="kind"></span><span class="title"></span><span class="note"></span>';
    a.querySelector(".kind").textContent = domain.page.kind;
    a.querySelector(".title").textContent = domain.page.title;
    a.querySelector(".note").textContent = domain.page.note;
    host.appendChild(a);
  }
  const hits = query ? allTopics().filter(r => r.topic.toLowerCase().includes(query)) : [];
  if (query) {
    const box = document.createElement("div");
    box.className = "hits";
    const label = document.createElement("div");
    label.className = "meta";
    label.textContent = hits.length ? ("全库命中 " + hits.length + " 条") : "没有这个标题";
    box.appendChild(label);
    hits.forEach(r => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "hit" + (r.track.id === track.id && r.domain.id === domain.id ? " on" : "");
      b.innerHTML = '<span class="where"></span><span class="what"></span>';
      b.querySelector(".where").textContent = r.track.title + " · " + r.domain.label;
      b.querySelector(".what").textContent = r.empty ? r.topic + " · 标题下无正文" : r.topic;
      b.onclick = () => { current = { track: r.track.id, domain: r.domain.id }; render(); };
      box.appendChild(b);
    });
    host.appendChild(box);
  }
  if (domain.groups) {
    domain.groups.forEach(g => {
      const list = query ? g.topics.filter(t => t.toLowerCase().includes(query)) : g.topics;
      if (!list.length) return;
      const lab = document.createElement("div");
      lab.className = "glab";
      lab.textContent = g.label + " · " + g.en + " · " + list.length + " 本";
      const row = document.createElement("div");
      row.className = "chips";
      list.forEach(t => row.appendChild(chip(t, false, query)));
      host.append(lab, row);
    });
    if (query && !domain.topics.some(t => t.toLowerCase().includes(query))) {
      const empty = document.createElement("div");
      empty.className = "meta";
      empty.textContent = "这个节点里没有命中。上面是全库结果。";
      host.appendChild(empty);
    }
    return;
  }
  const chips = document.createElement("div");
  chips.className = "chips";
  const shown = query ? domain.topics.filter(t => t.toLowerCase().includes(query)) : domain.topics;
  if (!shown.length && !domain.future) {
    const empty = document.createElement("div");
    empty.className = "meta";
    empty.textContent = query ? "这个节点里没有命中。上面是全库结果。" : "这个节点还没有标题。";
    chips.appendChild(empty);
  }
  shown.forEach(t => chips.appendChild(chip(t, (domain.empty || []).includes(t), query)));
  host.appendChild(chips);
}

function render() {
  const query = qEl.value.trim().toLowerCase();
  const topics = allTopics();
  document.getElementById("src").textContent = DATA.source;
  document.getElementById("count").textContent =
    DATA.tracks.filter(t => !t.shared).map(t => t.title + " " + t.domains.reduce((n, d) => n + d.topics.length, 0)).join(" · ")
    + " · 线外 " + topics.filter(r => r.track.shared).length;
  renderMaps();
  renderDetail(query);
  const placed = topics.length;
  document.getElementById("foot").textContent =
    "已挂标题 " + placed + " 条 · 三条线分开 · JMP / Power BI / 阅读在个人学习里补。";
}

qEl.addEventListener("input", render);
render();
</script>
</body>
</html>
